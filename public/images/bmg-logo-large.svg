<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Background shape -->
  <rect x="20" y="20" width="260" height="260" rx="12" fill="#fcf9f8" stroke="#1c1b1b" stroke-width="2"/>

  <!-- BMG Letters -->
  <text x="150" y="160" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="80" fill="#bd001a" letter-spacing="-4">BMG</text>

  <!-- Decorative lines -->
  <line x1="50" y1="190" x2="250" y2="190" stroke="#3759b3" stroke-width="4"/>
  <line x1="50" y1="200" x2="200" y2="200" stroke="#e61e2a" stroke-width="3"/>

  <!-- Accent dots -->
  <circle cx="50" cy="60" r="6" fill="#3759b3"/>
  <circle cx="70" cy="60" r="6" fill="#bd001a"/>
  <circle cx="90" cy="60" r="6" fill="#5c5d5e"/>

  <!-- Tagline -->
  <text x="150" y="240" text-anchor="middle" font-family="monospace" font-weight="700" font-size="14" fill="#5d3f3c" letter-spacing="2">PRECISION MEDIA. RAW ENERGY.</text>
</svg>
